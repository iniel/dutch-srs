[project]
name = "hpmor-nl-tools"
version = "0.1.0"
description = "Deterministic tools for the HPMOR -> Dutch (A2-B1) adaptation pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "spacy>=3.8,<3.9",
    "nl-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/nl_core_news_lg-3.8.0/nl_core_news_lg-3.8.0-py3-none-any.whl",
    "pyyaml>=6",
]

[project.scripts]
nl-extract = "nltools.extract:main"
nl-lexicon = "nltools.lexicon_build:main"
nl-vocab = "nltools.vocab_check:main"
nl-grammar = "nltools.grammar_check:main"
nl-check = "nltools.check_scene:main"
nl-cohesion = "nltools.cohesion_check:main"
nl-assemble = "nltools.assemble:main"
nl-experiment = "nltools.experiment:main"
nl-finalize = "nltools.finalize:main"
nl-reader = "nltools.reader_export:main"
nl-text = "nltools.text_import:main"
nl-memory = "nltools.memory:main"
nl-diff = "nltools.diff:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tools/nltools"]

[dependency-groups]
dev = ["pytest>=8"]
